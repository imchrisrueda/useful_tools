name: Feature request
description: Propose an improvement to a tool, skill, or procedure.
labels: ["enhancement"]
body:
  - type: input
    id: component
    attributes:
      label: Component or proposed path
      placeholder: "herdr_usage, skills/<name>, procedures/<name>"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and how to check it
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements and data sources
      description: "For Herdr metrics, identify the documented local source and provide a redacted example when available."
