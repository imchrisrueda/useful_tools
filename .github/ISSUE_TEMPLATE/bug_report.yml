name: Bug report
description: Report a problem with a tool, skill, or procedure.
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Component or path
      placeholder: "herdr_usage, skills/<name>, procedures/<name>"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Relevant versions and operating system
      description: "For herdr_usage, include the plugin, Herdr and agent CLI versions."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: "Redact credentials and private session content."
      render: text
